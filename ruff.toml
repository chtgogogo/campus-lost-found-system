# Ruff 配置（CI lint 用）。
# 目标：拦截真实缺陷（F 未定义/未使用、E9 语法、B 安全陷阱、E 基础风格），
#       忽略纯格式/风格噪音（行宽、未用导入、中文全角标点、嵌套 if 简化等），
#       保证 CI 在「不改既有代码」前提下保持绿色。
line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",   # 行宽已由 line-length 处理，避免大量既有长行报红
    "E402",   # 既有模块在函数定义后导入（如 routers/match.py），非缺陷
    "F401",   # 既有代码存在未使用导入（兼容/延迟导入），非缺陷
    "B008",   # FastAPI 依赖注入 decorators（Depends/BackgroundTasks）的惯用法
    "B904",   # 既有 except 内 raise 未用 `from`，风格项非缺陷
    "B005",   # 既有 `rstrip(" · ")` 多字符裁剪为有意行为
    "E731",   # 既有 `utcnow = lambda:` 模块级 lambda，兼容性写法
    "E741",   # 既有单字母变量（如 `l` for LostItem），可读性可接受
    "RUF003", # 中文全角标点出现在注释/字符串中（项目全中文注释，属正常）
]

[lint.per-file-ignores]
# 第三方工具/文档脚本（tools/）仅拦截致命错误
"tools/**/*.py" = ["B"]
# 测试文件：sys.path.insert 后再导入属正常模式；测试内未使用的中间变量属正常
"tests/**/*.py" = ["E402", "F841"]

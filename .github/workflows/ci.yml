name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # 无需任何 secret：纯开源依赖 + 进程内内存兜底（REDIS_ENABLED 在测试环境为 false）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        # 仅对后端运行时与测试代码做 lint（tools/ 含不可改动的文档脚本，不纳入 CI lint 面）
        run: ruff check app tests

      - name: Run tests
        # 测试环境 REDIS_ENABLED=false（见 tests/conftest.py），KV 走进程内内存兜底，
        # 不依赖外部 Redis / MySQL；MySQL 相关用例在无服务时自动 skip。
        run: pytest -q

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # 无需任何 secret：纯开源依赖 + 进程内内存兜底（REDIS_ENABLED 在测试环境为 false）；
    # MySQL service 供 tests/db_tests 真连建表（root 空密码 = 测试候选凭据第一优先，
    # 此前本地 MySQL 不可用时该组用例自动 skip，2026-09-24 起生产库路径进 CI）。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        # 仅对后端运行时与测试代码做 lint（tools/ 含不可改动的文档脚本，不纳入 CI lint 面）
        run: ruff check app tests

      - name: Run tests
        # 测试环境 REDIS_ENABLED=false（见 tests/conftest.py），KV 走进程内内存兜底，
        # 不依赖外部 Redis / MySQL；MySQL 相关用例在无服务时自动 skip。
        # 必须用 `python -m pytest` 而非裸 `pytest`：后者不把仓库根加入 sys.path，
        # conftest 导入 `app` 包会 ModuleNotFoundError（审查 P0 修复 2026-09-24 实测）。
        run: python -m pytest -q

  web-typecheck-test:
    # 审查 P1（2026-09-24）：前端质量门禁——type-check + vitest 单测进 CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (vue-tsc)
        run: npm run type-check

      - name: Unit tests (vitest)
        run: npm test

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # 无需任何 secret：纯开源依赖 + 进程内内存兜底（REDIS_ENABLED 在测试环境为 false）；
    # MySQL service 供 tests/db_tests 真连建表（root 空密码 = 测试候选凭据第一优先，
    # 此前本地 MySQL 不可用时该组用例自动 skip，2026-09-24 起生产库路径进 CI）。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # v17③：用 pip-compile 冻结的 requirements.lock 安装（可复现构建）；
        # requirements.txt 保留范围约束作上游源，依赖升级改 requirements.txt 后
        # 用 `pip-compile requirements.txt -o requirements.lock --allow-unsafe` 再生成 lock。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install ruff pip-audit

      - name: Dependency audit (pip-audit)
        # v17③ 依赖扫描门禁：已知漏洞即失败。豁免登记（修复发布后移除）：
        # - PYSEC-2026-3740（nltk）：上游 nltk 3.10.3 为最新版、该漏洞暂无修复版本；
        #   本项目仅用 WordNet 同义词表（本地数据文件，不解析不可信文本），修复发布后移除豁免。
        run: pip-audit --ignore-vuln PYSEC-2026-3740

      - name: Lint (ruff)
        # 仅对后端运行时与测试代码做 lint（tools/ 含不可改动的文档脚本，不纳入 CI lint 面）
        run: ruff check app tests

      - name: Eval gate (main set 40 pairs)
        # v17 评测门禁：主集 F1 低于 --fail-under（缺省 settings.EVAL_FAIL_UNDER=76，
        # 单一事实源在 config.py）时退出码非 0，阻断 CI；F1/召回率写入 Job Summary。
        # 放在 pytest 之前：秒级跑完，快速失败省 5 分钟测试时间。
        # 红线：盲集 dataset_blind.json 禁止挂进常规 CI（每 commit 都跑会被「跑熟」失效），
        # 仅打 tag 时人工跑并归档（CHANGELOG v17）。
        run: |
          set -o pipefail
          python evaluation/run_eval.py 2>&1 | tee eval_gate.txt
          {
            echo "## 匹配引擎评测门禁（主集 40 对，--fail-under 见 config.EVAL_FAIL_UNDER）"
            echo ""
            echo '```'
            head -7 eval_gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        # 测试环境 REDIS_ENABLED=false（见 tests/conftest.py），KV 走进程内内存兜底，
        # 不依赖外部 Redis / MySQL；MySQL 相关用例在无服务时自动 skip。
        # 必须用 `python -m pytest` 而非裸 `pytest`：后者不把仓库根加入 sys.path，
        # conftest 导入 `app` 包会 ModuleNotFoundError（审查 P0 修复 2026-09-24 实测）。
        run: python -m pytest -q

  web-typecheck-test:
    # 审查 P1（2026-09-24）：前端质量门禁——type-check + vitest 单测进 CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (vue-tsc)
        run: npm run type-check

      - name: Dependency audit (npm audit)
        # v17③ 依赖扫描门禁：high 及以上漏洞阻断（vite 8.3.1 / vitest 5.0.1 升级后 0 漏洞）
        run: npm audit --audit-level=high

      - name: Unit tests (vitest)
        run: npm test

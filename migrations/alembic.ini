# Alembic config (migration skeleton; used in production).
# Note: MVP dev uses Base.metadata.create_all (see app.core.database.init_db).
# To use Alembic: pip install alembic && alembic upgrade head
[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
sqlalchemy.url = sqlite:///./dev.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
